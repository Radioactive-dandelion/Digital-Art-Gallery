spring.application.name=order-service
server.port=8083

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gallery_orders}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.root=INFO
logging.level.com.gallery.orderservice=DEBUG

# JWT — тот же секрет что и в user-service
app.jwt.secret=${JWT_SECRET:jwt-secret-key}

# Internal secret для межсервисного общения
app.internal.secret=${INTERNAL_SECRET:internal-secret}

# URLs других сервисов
app.user-service.url=${USER_SERVICE_URL:http://localhost:8081}
app.product-service.url=${PRODUCT_SERVICE_URL:http://localhost:8082}

# Отключить автогенерацию пароля Spring Security
spring.security.user.password=disabled
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Snake_case JSON mapping
spring.jackson.property-naming-strategy=SNAKE_CASE
